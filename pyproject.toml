[project]
name = "pypaystack2"
version = "3.4.0"
description = "A developer-friendly client library for Paystack"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Gbenga Adeyi", email = "adeyigbenga005@gmail.com" }
]
keywords = ["paystack-python", "pypaystack", "paystack", "paystackapi"]
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
]


requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.14.0",
]

[project.scripts]
pypaystack2 = "pypaystack2.cli:cli_app"

[project.optional-dependencies]
webhook = [
    "fastapi[standard]>=0.143.0",
    "ngrok>=1.4.0",
    "python-dotenv>=1.2.4",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.5.0",
    { include-group = "format" },
    { include-group = "test" },
    { include-group = "coverage" },
]
format = [
    "ruff>=0.17.0",
]
test = [
    "python-dotenv>=1.2.4",
    "tomli>=2.5.0",
]
coverage = []
doc = [
    "mike>=2.2.0",
    "mkdocs>=1.6.1",
    "mkdocs-glightbox>=0.5.2",
    "mkdocs-material>=9.7.0",
    "mkdocstrings>=1.0.0",
    "mkdocstrings-python>=2.0.1",
]

